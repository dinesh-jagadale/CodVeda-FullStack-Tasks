<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rooms | Hostel Management System</title>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header">
    <h1>Room Management</h1>
    <p>Add, view, and manage hostel rooms</p>
  </header>

  <nav class="navbar">
    <a href="index.html">Dashboard</a>
    <a href="students.html">Students</a>
    <a href="rooms.html" class="active">Rooms</a>
  </nav>

  <main class="container">

    <section class="form-section">
      <h2>Add New Room</h2>

      <form id="roomForm">
        <input type="text" id="roomNumber" placeholder="Room Number (e.g. A-101)" required />
        <input type="number" id="capacity" placeholder="Capacity" min="1" max="3" required />
        <button type="submit">Add Room</button>
      </form>

      <p id="formMessage" class="message"></p>
    </section>

    <section class="list-section">
      <h2>Room List</h2>

      <table>
        <thead>
          <tr>
            <th>Room Number</th>
            <th>Capacity</th>
            <th>Occupants</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="roomTableBody"></tbody>
      </table>
    </section>

  </main>

  <footer class="footer">
    <p>© 2026 Hostel Management System. All rights reserved.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/rooms.js"></script>

</body>
</html>
